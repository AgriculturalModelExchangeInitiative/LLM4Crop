[build-system]
requires = [
    "setuptools>=77.0.0",
    "wheel",
    "setuptools_scm",
  ]
build-backend = "setuptools.build_meta"

# enable dynamic versioning based on git tags
[tool.setuptools_scm]
# Format version to ease alignment with conda/meta.yaml tag-based versioning
fallback_version = "0.9.0.dev0"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[project]
name = "llm4crop"
dynamic = ["version"]
description = "LLM4Crop is a Python package for crop modeling and analysis using agentic LLMs ."
readme = "README.md"
authors = [
    { name = "Teiki Raihauti", email = "teiki.raihauti@inrae.fr" },
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
keywords = ["Crop2ML", "LLM", "Crop models"]

dependencies = [
]

[project.urls]
Homepage = "https://github.com/AgriculturalModelExchangeInitiative/LLM4Crop"


[project.optional-dependencies]
test = [
    "pytest",
]
doc = [
  "sphinx-favicon",
  "sphinx-rtd-theme",
  "pydata-sphinx-theme",
  "myst-parser",
  "sphinx-favicon",
  "nbsphinx",
]

[project.scripts]
"llm4crop" = "llm4crop.main:main"

# section specific to conda-only distributed package (not used by pip yet)
# based on astk, used in hydroroot with a meta.yaml that only use metadata from
# pyproject => only pyproject.toml must be modified
[tool.conda.environment]
channels = [
  "openalea3",
  "conda-forge"
]
dependencies = [
    "matplotlib-base",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.txt"]


